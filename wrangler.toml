name = "budgetalert"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron is always UTC, so the local hour shifts by one across DST; that is
# cosmetic for a digest. All three fire in the morning Pacific, on the first day
# of the new period, so each covers the period that just ended.
#
#   0 16 * * SUN       weekly digest, Sunday ~9am Pacific (weeks begin Sunday)
#   0 17 1 1,4,7,10 *  quarterly report, Jan/Apr/Jul/Oct 1st
#   0 18 1 1 *         yearly report, Jan 1st
#
# Jan 1 matches both report crons, hence the staggered hours: they arrive an
# hour apart rather than racing. src/core/schedule.ts reads the SHAPE of these
# expressions, not their exact text, so shifting an hour keeps them working.
# Delete a line to turn that report off; a monthly one would be "0 17 1 * *".
[triggers]
crons = ["0 16 * * SUN", "0 17 1 1,4,7,10 *", "0 18 1 1 *"]

# D1 database. Create it with:  wrangler d1 create budgetalert
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "budgetalert"
database_id = "631163d4-55eb-4c0f-9e09-936a482a30be"

# Non-secret defaults. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET)
# are set with `wrangler secret put <NAME>` — never commit them.
[vars]
WARN_PCT = "80"
ALERT_PCT = "100"
CURRENCY = "USD"
# "weekly", "monthly", "quarterly" or "yearly".
BUDGET_PERIOD = "weekly"
# Your bot's @handle without the @, e.g. "budgetalert_bot". Required for the
# natural-language path — it's how the Worker knows it was addressed.
TELEGRAM_BOT_USERNAME = "SpendingNotifyBot"
# Model for parsing natural-language messages. Sonnet 5 is a deliberate default
# over Opus 5: bounded extraction on a latency-sensitive webhook, and compiled
# grammars are cached only ~24h from last use, so a low-traffic bot would often
# pay compile latency on Opus for no accuracy gain.
NL_MODEL = "claude-sonnet-5"
# Budget periods are computed in this zone, with daylight saving handled. Set it
# to where you actually spend money — on UTC, a Saturday-night dinner in
# California is already Sunday and lands in the wrong week.
TIMEZONE = "America/Los_Angeles"
# "sunday" or "monday" — which day a budget week begins on.
WEEK_START = "sunday"
