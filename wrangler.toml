name = "budgetalert"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Weekly summary — Sunday 16:00 UTC, which is 9am Pacific during daylight
# saving and 8am in winter. Cron is always UTC, so the local hour shifts by one
# across DST; that's cosmetic for a summary. Sunday morning is chosen so the
# digest covers the week that just ended, given weeks now begin Sunday.
[triggers]
crons = ["0 16 * * 0"]

# D1 database. Create it with:  wrangler d1 create budgetalert
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "budgetalert"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Non-secret defaults. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET)
# are set with `wrangler secret put <NAME>` — never commit them.
[vars]
WARN_PCT = "80"
ALERT_PCT = "100"
CURRENCY = "USD"
BUDGET_PERIOD = "weekly"
# Your bot's @handle without the @, e.g. "budgetalert_bot". Required for the
# natural-language path — it's how the Worker knows it was addressed.
TELEGRAM_BOT_USERNAME = "REPLACE_WITH_YOUR_BOT_USERNAME"
# Model for parsing natural-language messages. Sonnet 5 is a deliberate default
# over Opus 5: bounded extraction on a latency-sensitive webhook, and compiled
# grammars are cached only ~24h from last use, so a low-traffic bot would often
# pay compile latency on Opus for no accuracy gain.
NL_MODEL = "claude-sonnet-5"
# Budget periods are computed in this zone, with daylight saving handled. Set it
# to where you actually spend money — on UTC, a Saturday-night dinner in
# California is already Sunday and lands in the wrong week.
TIMEZONE = "America/Los_Angeles"
# "sunday" or "monday" — which day a budget week begins on.
WEEK_START = "sunday"
